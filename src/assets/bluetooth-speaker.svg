<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="radiatorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <pattern id="grillePattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#334155" opacity="0.6" />
    </pattern>
    <filter id="speakerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Cylinder Speaker Body -->
  <g filter="url(#speakerShadow)">
    <!-- Base Body -->
    <rect x="110" y="110" width="180" height="180" rx="40" fill="url(#speakerGrad)" />
    <!-- Perforated Fabric Acoustic Mesh -->
    <rect x="115" y="115" width="170" height="170" rx="35" fill="url(#grillePattern)" />
    <!-- Center Rubberized Control Strip -->
    <rect x="180" y="110" width="40" height="180" fill="#0f172a" opacity="0.85" />
  </g>

  <!-- Bluetooth Icon (Center Top) -->
  <circle cx="200" cy="140" r="12" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
  <path d="M 197 134 L 203 140 L 200 143 L 200 137 L 203 140 L 197 146 M 200 134 L 200 146" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Volume Controls -->
  <!-- Plus (Vol +) -->
  <path d="M 200 165 L 200 177 M 194 171 L 206 171" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Play / Pause -->
  <circle cx="200" cy="200" r="14" fill="url(#accentGlow)" />
  <polygon points="197,194 206,200 197,206" fill="#ffffff" />

  <!-- Minus (Vol -) -->
  <path d="M 194 230 L 206 230" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Power Button -->
  <circle cx="200" cy="260" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <circle cx="200" cy="260" r="3" fill="#22c55e" />

  <!-- Left Passive Radiator Cap -->
  <ellipse cx="110" cy="200" rx="14" ry="40" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
  <ellipse cx="110" cy="200" rx="8" ry="24" fill="url(#radiatorGrad)" />
  <text x="108" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">BASS</text>

  <!-- Right Passive Radiator Cap -->
  <ellipse cx="290" cy="200" rx="14" ry="40" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
  <ellipse cx="290" cy="200" rx="8" ry="24" fill="url(#radiatorGrad)" />
  <text x="292" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">30W</text>

  <!-- Feature Badge Bottom -->
  <rect x="140" y="305" width="120" height="24" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="200" y="321" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">IPX7 WATERPROOF</text>
</svg>
