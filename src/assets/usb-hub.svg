<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Subtle Grid -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Cable Coming from Left -->
  <path d="M 60 200 C 90 200, 110 200, 140 200" stroke="url(#cableGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Cable Strain Relief -->
  <rect x="130" y="192" width="16" height="16" rx="4" fill="#1e293b" />
  <rect x="138" y="194" width="8" height="12" rx="2" fill="#475569" />

  <!-- Main Aluminum Hub Body -->
  <g filter="url(#shadow)">
    <!-- Outer Chamfer -->
    <rect x="140" y="140" width="200" height="120" rx="20" fill="url(#metalBevel)" />
    <!-- Inner Metallic Face -->
    <rect x="144" y="144" width="192" height="112" rx="16" fill="url(#hubBody)" />
  </g>

  <!-- Status Indicator LED (Glowing Blue) -->
  <circle cx="170" cy="165" r="4" fill="#38bdf8" />
  <circle cx="170" cy="165" r="7" fill="#38bdf8" opacity="0.3" />

  <!-- Brand Label -->
  <text x="185" y="168" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">HYPERDRIVE 8-IN-1</text>

  <!-- USB 3.0 Port 1 -->
  <rect x="165" y="195" width="40" height="18" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <rect x="167" y="197" width="36" height="6" fill="#0284c7" />
  <text x="174" y="224" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#64748b">USB 3.2</text>

  <!-- USB 3.0 Port 2 -->
  <rect x="220" y="195" width="40" height="18" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <rect x="222" y="197" width="36" height="6" fill="#0284c7" />
  <text x="229" y="224" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#64748b">USB 3.2</text>

  <!-- Type-C PD 100W Port -->
  <rect x="275" y="200" width="32" height="10" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <rect x="281" y="203" width="20" height="3" rx="1.5" fill="#38bdf8" />
  <text x="279" y="224" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#38bdf8">100W PD</text>

  <!-- SD / MicroSD Slots on Side (Right edge) -->
  <rect x="330" y="175" width="4" height="24" rx="2" fill="#0f172a" />
  <rect x="330" y="208" width="4" height="16" rx="2" fill="#0f172a" />

  <!-- 4K HDMI Logo/Text -->
  <text x="165" y="246" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">4K HDMI @ 60Hz</text>
  <text x="260" y="246" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#94a3b8">SD / TF DUAL</text>
</svg>
