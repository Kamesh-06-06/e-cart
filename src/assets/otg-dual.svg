<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="otgMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="otgShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#otgShadow)">
    <!-- USB Type-C Male Connector (Left) -->
    <rect x="70" y="180" width="60" height="40" rx="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <rect x="74" y="184" width="52" height="32" rx="7" fill="#0f172a" />
    <rect x="80" y="196" width="40" height="8" rx="4" fill="url(#goldTip)" />

    <!-- Main Metallic OTG Housing (Center) -->
    <rect x="130" y="160" width="140" height="80" rx="16" fill="url(#otgMetal)" stroke="#64748b" stroke-width="2" />

    <!-- Non-Slip Grip Grooves -->
    <line x1="160" y1="172" x2="160" y2="228" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="170" y1="172" x2="170" y2="228" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="172" x2="180" y2="228" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Status LED -->
    <circle cx="240" cy="180" r="4" fill="#38bdf8" />
    <circle cx="240" cy="180" r="7" fill="#38bdf8" opacity="0.4" />

    <!-- Text Engraving -->
    <text x="210" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#f8fafc" letter-spacing="1">FAST OTG</text>
    <text x="210" y="228" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#38bdf8">5Gbps SuperSpeed</text>

    <!-- USB 3.0 Female Port (Right) -->
    <rect x="270" y="172" width="60" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="274" y="176" width="52" height="48" rx="4" fill="#0f172a" />
    <!-- Blue USB 3.0 Plastic Tab inside -->
    <rect x="278" y="178" width="44" height="18" rx="2" fill="#0284c7" />
    <!-- 4 Gold Contact Pins -->
    <line x1="285" y1="184" x2="285" y2="194" stroke="#fbbf24" stroke-width="2" />
    <line x1="295" y1="184" x2="295" y2="194" stroke="#fbbf24" stroke-width="2" />
    <line x1="305" y1="184" x2="305" y2="194" stroke="#fbbf24" stroke-width="2" />
    <line x1="315" y1="184" x2="315" y2="194" stroke="#fbbf24" stroke-width="2" />

    <!-- Lanyard Loop (Top Right) -->
    <path d="M 255 160 C 255 145, 275 145, 275 160" stroke="#64748b" stroke-width="4" fill="none" />
  </g>

  <!-- Feature Pill -->
  <rect x="120" y="270" width="160" height="26" rx="13" fill="#0f172a" stroke="#334155" />
  <text x="200" y="287" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">TYPE-C TO USB 3.0 ADAPTER</text>
</svg>
